<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>Solarpunk Sandbox - v0.6.1</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        :root {
            --bg: #1a2639;
            --ui-bg: rgba(255, 255, 255, 0.85);
            --ui-active: #7cb06d;
            --ui-water: #4fa4d1;
            --ui-mech: #d4a373;
            --ui-chem: #c08552;
            --text: #2c3e50;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            touch-action: none;
        }
        #canvas-container {
            width: 100%;
            height: 100%;
            display: block;
        }
        #ui-container {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            background: var(--ui-bg);
            padding: 10px 15px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            backdrop-filter: blur(5px);
            z-index: 10;
            max-width: 90%;
            max-height: 40vh;
            overflow-y: auto;
        }
        .tool-btn {
            background: none;
            border: 2px solid transparent;
            padding: 8px;
            font-size: 1.2rem;
            border-radius: 20px;
            cursor: pointer;
            color: var(--text);
            font-weight: bold;
            transition: all 0.4s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 50px;
            height: 50px;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            animation: fadeIn 0.5s forwards ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px) scale(0.9); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        .tool-btn:active { transform: scale(0.95); }
        .tool-btn.active {
            background: var(--ui-active);
            color: white;
            box-shadow: 0 4px 15px rgba(124, 176, 109, 0.4);
        }
        .tool-btn.active[data-type="pump"], .tool-btn.active[data-type="collector"] {
            background: var(--ui-water);
            box-shadow: 0 4px 15px rgba(79, 164, 209, 0.4);
        }
        .tool-btn.active[data-type="wheel"], .tool-btn.active[data-type="pipe"] {
            background: var(--ui-mech);
            box-shadow: 0 4px 15px rgba(212, 163, 115, 0.4);
        }
        .tool-btn.active[data-type="composter"], .tool-btn.active[data-type="biomass"] {
            background: var(--ui-chem);
            box-shadow: 0 4px 15px rgba(192, 133, 82, 0.4);
        }
        #harmony-banner {
            position: absolute;
            top: 15%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 255, 255, 0.95);
            color: #7cb06d;
            padding: 15px 30px;
            border-radius: 30px;
            font-size: 1.5rem;
            font-weight: bold;
            box-shadow: 0 10px 30px rgba(124, 176, 109, 0.3);
            opacity: 0;
            pointer-events: none;
            transition: opacity 2s ease-in-out;
            z-index: 20;
            text-align: center;
        }
        #status-bar {
            position: absolute;
            top: 20px;
            left: 20px;
            background: var(--ui-bg);
            padding: 12px 15px;
            border-radius: 15px;
            color: var(--text);
            font-size: 0.9rem;
            font-weight: 600;
            pointer-events: none;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .stat-row { display: flex; align-items: center; gap: 8px; }
        .icon-energy { color: #f39c12; font-size: 1.1rem; }
        .icon-water { color: #3498db; font-size: 1.1rem; }
        .icon-compost { color: #8b5a2b; font-size: 1.1rem; }
        
        /* NEW: Dev Toggle Styles */
        #dev-toggle-container {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.85);
            padding: 10px 15px;
            border-radius: 15px;
            font-size: 0.9rem;
            color: var(--text);
            font-weight: bold;
            z-index: 100;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            display: flex;
            align-items: center;
            gap: 8px;
            backdrop-filter: blur(5px);
        }
        #dev-toggle-container input {
            cursor: pointer;
            width: 16px;
            height: 16px;
            accent-color: var(--ui-active);
        }
        
        #controls-hint {
            position: absolute;
            top: 70px; /* Moved down to accommodate dev toggle */
            right: 20px;
            background: rgba(255,255,255,0.5);
            padding: 8px 15px;
            border-radius: 15px;
            font-size: 0.8rem;
            color: var(--text);
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="canvas-container"></div>
    
    <div id="status-bar">
        <div class="stat-row">
            <span class="icon-energy">⚡</span> 
            <span id="val-energy">0</span> / <span id="val-cap">0</span> kWh
        </div>
        <div class="stat-row">
            <span class="icon-water">💧</span> 
            <span id="val-water">0</span> / <span id="val-wcap">0</span> L
        </div>
        <div class="stat-row">
            <span class="icon-compost">🍂</span> 
            <span id="val-compost">0</span> / <span id="val-ccap">0</span> kg
        </div>
    </div>

    <label id="dev-toggle-container">
        <input type="checkbox" id="dev-mode-toggle"> Unlock All
    </label>

    <div id="controls-hint">Drag to Rotate &bull; Pinch to Zoom</div>

    <div id="harmony-banner">Harmony Achieved<br><span style="font-size: 0.9rem; font-weight: normal; color: #555;">The biome is self-sustaining.</span></div>

    <div id="ui-container"></div>

    <script>
        // ==========================================
        // 🧠 PROGRESSION ARCHITECTURE & PHILOSOPHY
        // ==========================================
        let DEV_MODE = false; 

        const DISCIPLINES = {
            MECHANICAL: 'mechanical',       
            ELECTRICAL: 'electrical',       
            CIVIL: 'civil',                 
            ENVIRONMENTAL: 'environmental', 
            AGRICULTURAL: 'agricultural',
            CHEMISTRY: 'chemistry'
        };

        // Natural Knowledge state
        const KNOWLEDGE = {
            understands_daylight: true,       
            understands_power_flow: true,     
            understands_storage: false,       
            understands_wind: false,          
            understands_rain: false,          
            understands_agriculture: false,   
            understands_pumping: false,
            understands_kinetic_energy: false,
            understands_decay: false 
        };

        const NODE_REGISTRY = {
            'solar': { id: 'solar', icon: '☀️', req: ['understands_daylight'] },
            'light': { id: 'light', icon: '💡', req: ['understands_power_flow'] },
            'battery': { id: 'battery', icon: '🔋', req: ['understands_storage'] },
            'wind': { id: 'wind', icon: '🌀', req: ['understands_wind'] },
            'collector': { id: 'collector', icon: '🪣', req: ['understands_rain'] },
            'garden': { id: 'garden', icon: '🌱', req: ['understands_agriculture'] },
            'pump': { id: 'pump', icon: '🚰', req: ['understands_pumping'] },
            'wheel': { id: 'wheel', icon: '🎡', req: ['understands_kinetic_energy'] },
            'pipe': { id: 'pipe', icon: '🛤️', req: ['understands_kinetic_energy'] },
            'composter': { id: 'composter', icon: '🍂', req: ['understands_decay'] },
            'biomass': { id: 'biomass', icon: '🔥', req: ['understands_decay'] }
        };

        // ==========================================
        // 🎮 GAME STATE
        // ==========================================
        const CYCLE_DURATION = 60; 
        const GRID_SIZE = 2;
        const ISLAND_SIZE = 40; 
        const GRID_EXTENT = (ISLAND_SIZE / 2) - 2;
        
        const GAME = {
            energy: 0, capacity: 0,
            water: 0, waterCapacity: 0,
            compost: 0, compostCapacity: 0,
            nodes: [], gridMap: new Set(),
            selectedType: 'solar',
            time: 0, stableTime: 0, harmonyReached: false,
            
            timers: { blackout: 0, wind: 0, rain: 0, drought: 0, river: 0, decay: 0 },
            uiRenderedNodes: new Set(), // Used to track what is currently built in the UI

            weather: { cloudCover: 0, windSpeed: 0.2, rainIntensity: 0 }
        };

        // ==========================================
        // 🖥️ UI & DISCOVERY SYSTEM
        // ==========================================
        const uiContainer = document.getElementById('ui-container');
        const devToggle = document.getElementById('dev-mode-toggle');

        // Dev Toggle Listener
        devToggle.addEventListener('change', (e) => {
            DEV_MODE = e.target.checked;
            updateUI(); // Immediately redraw the UI
        });

        // Refactored to properly redraw/clear UI elements
        function updateUI() {
            uiContainer.innerHTML = ''; // Clear out old buttons completely
            GAME.uiRenderedNodes.clear();
            let selectedTypeExists = false;

            for (const [key, node] of Object.entries(NODE_REGISTRY)) {
                // If Dev Mode is ON, pretend we have all knowledge. Otherwise, check real knowledge.
                const hasKnowledge = DEV_MODE || node.req.every(req => KNOWLEDGE[req]);
                
                if (hasKnowledge) {
                    const btn = document.createElement('button');
                    btn.className = 'tool-btn';
                    btn.dataset.type = key;
                    btn.innerHTML = node.icon;
                    
                    if (key === GAME.selectedType || (GAME.uiRenderedNodes.size === 0 && !selectedTypeExists)) {
                        btn.classList.add('active');
                        GAME.selectedType = key;
                        selectedTypeExists = true;
                    }

                    btn.addEventListener('pointerdown', (e) => {
                        e.stopPropagation();
                        document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
                        btn.classList.add('active');
                        GAME.selectedType = key;
                    });

                    uiContainer.appendChild(btn);
                    GAME.uiRenderedNodes.add(key);
                }
            }

            // Fallback selection if the tool we had selected just got locked/removed
            if (!selectedTypeExists && GAME.uiRenderedNodes.size > 0) {
                const firstBtn = uiContainer.querySelector('.tool-btn');
                if(firstBtn) {
                    firstBtn.classList.add('active');
                    GAME.selectedType = firstBtn.dataset.type;
                }
            }
        }
        
        updateUI(); // Initial run

        // ==========================================
        // 🌍 THREE.JS SETUP & ENGINE
        // ==========================================
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        
        const colDayClear = new THREE.Color(0x8bd4e8);
        const colDayCloud = new THREE.Color(0x708090);
        const colNight = new THREE.Color(0x0a1128);
        
        scene.background = colDayClear.clone();
        scene.fog = new THREE.Fog(colDayClear.clone(), 30, 100);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 150);
        camera.position.set(35, 40, 35);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.enablePan = false; 
        controls.maxPolarAngle = Math.PI / 2 - 0.05; 
        controls.minDistance = 15;
        controls.maxDistance = 80;
        controls.target.set(0, 0, 0);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
        scene.add(ambientLight);
        const sun = new THREE.DirectionalLight(0xfff5b6, 1.5);
        sun.castShadow = true;
        sun.shadow.mapSize.width = 2048; 
        sun.shadow.mapSize.height = 2048;
        sun.shadow.camera.near = 0.5; sun.shadow.camera.far = 100;
        sun.shadow.camera.left = -30; sun.shadow.camera.right = 30;
        sun.shadow.camera.top = 30; sun.shadow.camera.bottom = -30;
        sun.shadow.bias = -0.001;
        scene.add(sun);
        const moon = new THREE.DirectionalLight(0x7c9bc2, 0.2);
        scene.add(moon);

        // --- TERRAFORMING (Split Island & River) ---
        const matGrass = new THREE.MeshStandardMaterial({ color: 0x7cb06d, roughness: 0.9 });
        const matDirt = new THREE.MeshStandardMaterial({ color: 0x8c7356, roughness: 1.0 });
        const matRiver = new THREE.MeshStandardMaterial({ color: 0x3498db, transparent: true, opacity: 0.8, roughness: 0.1 });
        
        const islandGroup = new THREE.Group();
        const raycastTargets = [];

        const widthHalf = (ISLAND_SIZE - 4) / 2;
        const leftGeo = new THREE.BoxGeometry(widthHalf, 4, ISLAND_SIZE);
        const islandLeft = new THREE.Mesh(leftGeo, matGrass);
        islandLeft.position.set(-widthHalf/2 - 2, -2, 0);
        islandLeft.receiveShadow = true; islandLeft.castShadow = true;
        islandGroup.add(islandLeft);
        raycastTargets.push(islandLeft);

        const rightGeo = new THREE.BoxGeometry(widthHalf, 4, ISLAND_SIZE);
        const islandRight = new THREE.Mesh(rightGeo, matGrass);
        islandRight.position.set(widthHalf/2 + 2, -2, 0);
        islandRight.receiveShadow = true; islandRight.castShadow = true;
        islandGroup.add(islandRight);
        raycastTargets.push(islandRight);

        const bedGeo = new THREE.BoxGeometry(4, 3, ISLAND_SIZE);
        const riverBed = new THREE.Mesh(bedGeo, matDirt);
        riverBed.position.set(0, -2.5, 0);
        islandGroup.add(riverBed);

        const riverGeo = new THREE.BoxGeometry(4, 0.8, ISLAND_SIZE);
        const riverMesh = new THREE.Mesh(riverGeo, matRiver);
        riverMesh.position.set(0, -0.6, 0); 
        riverMesh.receiveShadow = true;
        islandGroup.add(riverMesh);
        raycastTargets.push(riverMesh); 

        scene.add(islandGroup);

        // --- PARTICLES (Wind/Spores & Rain) ---
        const pCount = 200;
        const sporeGeo = new THREE.BufferGeometry();
        const sporePos = new Float32Array(pCount * 3);
        const rainGeo = new THREE.BufferGeometry();
        const rainPos = new Float32Array(pCount * 3);

        for(let i=0; i<pCount*3; i++) {
            sporePos[i] = (Math.random() - 0.5) * ISLAND_SIZE * 1.5;
            rainPos[i] = (Math.random() - 0.5) * ISLAND_SIZE * 1.5;
        }
        sporeGeo.setAttribute('position', new THREE.BufferAttribute(sporePos, 3));
        rainGeo.setAttribute('position', new THREE.BufferAttribute(rainPos, 3));

        const matSpore = new THREE.PointsMaterial({ size: 0.2, color: 0xffffff, transparent: true, opacity: 0.6 });
        const matRain = new THREE.PointsMaterial({ size: 0.15, color: 0x8bd4e8, transparent: true, opacity: 0 }); 
        
        const particlesSpore = new THREE.Points(sporeGeo, matSpore);
        const particlesRain = new THREE.Points(rainGeo, matRain);
        scene.add(particlesSpore);
        scene.add(particlesRain);


        // --- NODE MATERIALS ---
        const mats = {
            white: new THREE.MeshStandardMaterial({ color: 0xfdfdfd, roughness: 0.2 }),
            wood: new THREE.MeshStandardMaterial({ color: 0xd4a373, roughness: 0.8 }),
            darkWood: new THREE.MeshStandardMaterial({ color: 0x8b5a2b, roughness: 0.9 }),
            panel: new THREE.MeshStandardMaterial({ color: 0x1f3b4d, roughness: 0.2, metalness: 0.8 }),
            battEmpty: new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.5 }),
            battFill: new THREE.MeshStandardMaterial({ color: 0x4caf50, emissive: 0x4caf50, emissiveIntensity: 0.2 }),
            lightOff: new THREE.MeshStandardMaterial({ color: 0xaaaaaa, roughness: 0.4 }),
            lightOn: new THREE.MeshStandardMaterial({ color: 0xffea00, emissive: 0xffea00, emissiveIntensity: 1.5 }),
            turbine: new THREE.MeshStandardMaterial({ color: 0xe0e0e0, roughness: 0.4 }),
            water: new THREE.MeshStandardMaterial({ color: 0x3498db, emissive: 0x3498db, emissiveIntensity: 0.2 }),
            dirt: new THREE.MeshStandardMaterial({ color: 0x5c4033, roughness: 1.0 }),
            plant: new THREE.MeshStandardMaterial({ color: 0x2ecc71, roughness: 0.6 }),
            leaf: new THREE.MeshStandardMaterial({ color: 0xa8b031, roughness: 0.8 }), 
            fireOff: new THREE.MeshStandardMaterial({ color: 0x331100, roughness: 0.9 }),
            fireOn: new THREE.MeshStandardMaterial({ color: 0xff5500, emissive: 0xff4400, emissiveIntensity: 1.5 })
        };

        // ==========================================
        // 🏗️ BUILDING FACTORY
        // ==========================================
        function createNode(type, x, z) {
            const key = `${x},${z}`;
            if(GAME.gridMap.has(key)) return;
            GAME.gridMap.add(key);

            const group = new THREE.Group();
            const yPos = (x === 0) ? -0.2 : 0; 
            group.position.set(x, yPos, z);
            
            let node = { type, group, x, z };

            if(type === 'solar') {
                const b = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.2, 1.2), mats.white);
                const p = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 0.8), mats.white);
                const pan = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.1, 1.6), mats.panel);
                b.position.y = 0.1; p.position.y = 0.5; pan.position.y = 0.9; pan.rotation.x = Math.PI / 6;
                b.castShadow = p.castShadow = pan.castShadow = true;
                group.add(b, p, pan);
                node.panel = pan;
            } 
            else if(type === 'battery') {
                const b = new THREE.Mesh(new THREE.BoxGeometry(1.4, 0.2, 1.4), mats.white);
                const shell = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.5, 1.2, 16), mats.battEmpty);
                const fill = new THREE.Mesh(new THREE.CylinderGeometry(0.52, 0.52, 1.2, 16), mats.battFill);
                b.position.y = 0.1; shell.position.y = 0.8; fill.position.y = 0.8; fill.scale.y = 0.01;
                b.castShadow = shell.castShadow = true;
                group.add(b, shell, fill);
                node.fillMesh = fill;
            }
            else if(type === 'light') {
                const b = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.2, 0.8), mats.wood);
                const p = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 2), mats.wood);
                const bulb = new THREE.Mesh(new THREE.SphereGeometry(0.3, 16, 16), mats.lightOff);
                const pLight = new THREE.PointLight(0xffea00, 0, 8);
                b.position.y = 0.1; p.position.y = 1.1; bulb.position.y = pLight.position.y = 2.2;
                b.castShadow = p.castShadow = true;
                group.add(b, p, bulb, pLight);
                node.bulb = bulb; node.pLight = pLight; node.isOn = false;
            }
            else if(type === 'wind') {
                const b = new THREE.Mesh(new THREE.BoxGeometry(1.0, 0.3, 1.0), mats.turbine);
                const t = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.25, 4, 8), mats.turbine);
                const nac = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.5, 0.8), mats.turbine);
                b.position.y = 0.15; t.position.y = 2.3; nac.position.set(0, 4.3, -0.2);
                const rGroup = new THREE.Group(); rGroup.position.set(0, 4.3, 0.2);
                rGroup.add(new THREE.Mesh(new THREE.SphereGeometry(0.2, 8, 8), mats.turbine));
                for(let i=0; i<3; i++) {
                    const bl = new THREE.Mesh(new THREE.BoxGeometry(0.1, 1.8, 0.05), mats.turbine);
                    bl.position.y = 0.9; bl.castShadow = true;
                    const piv = new THREE.Group(); piv.rotation.z = (i * Math.PI*2)/3;
                    piv.add(bl); rGroup.add(piv);
                }
                b.castShadow = t.castShadow = nac.castShadow = true;
                group.add(b, t, nac, rGroup);
                node.rotor = rGroup; rGroup.rotation.z = Math.random() * Math.PI;
            }
            else if (type === 'collector') {
                const barrel = new THREE.Mesh(new THREE.CylinderGeometry(0.6, 0.5, 1.0, 12), mats.wood);
                const wFill = new THREE.Mesh(new THREE.CylinderGeometry(0.55, 0.55, 0.9, 12), mats.water);
                barrel.position.y = 0.5; wFill.position.y = 0.5; wFill.scale.y = 0.01;
                barrel.castShadow = true;
                group.add(barrel, wFill);
                node.fillMesh = wFill;
            }
            else if (type === 'pump') {
                const b = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.5, 1.2), mats.white);
                const pipe = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.15, 1.5), mats.white);
                b.position.y = 0.25; pipe.position.y = 1.0; pipe.rotation.x = Math.PI/4;
                b.castShadow = pipe.castShadow = true;
                group.add(b, pipe);
            }
            else if (type === 'garden') {
                const dirt = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.2, 1.8), mats.dirt);
                dirt.position.y = 0.1; dirt.castShadow = dirt.receiveShadow = true;
                group.add(dirt);
                node.plants = [];
                for(let i=0; i<4; i++) {
                    const p = new THREE.Mesh(new THREE.SphereGeometry(0.2, 8, 8), mats.plant);
                    p.position.set((Math.random()-0.5)*1.2, 0.2, (Math.random()-0.5)*1.2);
                    p.scale.set(0.1, 0.1, 0.1); p.castShadow = true;
                    group.add(p); node.plants.push(p);
                }
                const leaf = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.02, 0.1), mats.leaf);
                leaf.position.set(0, 1.5, 0);
                leaf.visible = false;
                group.add(leaf);
                node.leaf = leaf;
                node.leafFallPhase = Math.random(); 
            }
            else if (type === 'wheel') {
                const b1 = new THREE.Mesh(new THREE.BoxGeometry(0.2, 1.0, 0.2), mats.darkWood);
                const b2 = new THREE.Mesh(new THREE.BoxGeometry(0.2, 1.0, 0.2), mats.darkWood);
                b1.position.set(-0.8, 0.3, 0); b2.position.set(0.8, 0.3, 0);
                b1.castShadow = b2.castShadow = true;
                
                const rotorGroup = new THREE.Group();
                rotorGroup.position.set(0, 0.3, 0);
                const axle = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 1.8), mats.darkWood);
                axle.rotation.z = Math.PI/2;
                rotorGroup.add(axle);
                
                for(let i=0; i<6; i++) {
                    const paddle = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.8, 0.1), mats.wood);
                    paddle.position.y = 0.4; paddle.castShadow = true;
                    const piv = new THREE.Group(); piv.rotation.x = (i * Math.PI*2)/6;
                    piv.add(paddle); rotorGroup.add(piv);
                }
                group.add(b1, b2, rotorGroup);
                node.rotor = rotorGroup;
            }
            else if (type === 'pipe') {
                const p1 = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.4, 0.2), mats.darkWood);
                const p2 = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.4, 0.2), mats.darkWood);
                p1.position.set(0, 0.2, -0.6); p2.position.set(0, 0.2, 0.6);
                const trough = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.3, 1.8), mats.wood);
                trough.position.y = 0.55;
                const waterLine = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.35, 1.8), mats.water);
                waterLine.position.y = 0.55;
                p1.castShadow = p2.castShadow = trough.castShadow = true;
                group.add(p1, p2, trough, waterLine);
            }
            else if (type === 'composter') {
                const box = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.8, 1.2), mats.wood);
                box.position.y = 0.4; box.castShadow = true;
                const fill = new THREE.Mesh(new THREE.BoxGeometry(1.0, 0.7, 1.0), mats.dirt);
                fill.position.y = 0.4; fill.scale.y = 0.01;
                group.add(box, fill);
                node.fillMesh = fill;
            }
            else if (type === 'biomass') {
                const base = new THREE.Mesh(new THREE.BoxGeometry(1.4, 1.2, 1.4), mats.turbine);
                base.position.y = 0.6; base.castShadow = true;
                const stack = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 1.5), mats.turbine);
                stack.position.set(0.3, 1.5, -0.3); stack.castShadow = true;
                const core = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.5, 0.1), mats.fireOff);
                core.position.set(0, 0.5, 0.71); 
                const pLight = new THREE.PointLight(0xff5500, 0, 8);
                pLight.position.set(0, 0.5, 1.0);
                group.add(base, stack, core, pLight);
                node.core = core; node.pLight = pLight; node.isOn = false;
            }

            group.scale.set(0, 0, 0);
            scene.add(group);
            GAME.nodes.push(node);
        }

        // --- INTERACTION ---
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        let pDown = new THREE.Vector2(), pTime = 0;

        window.addEventListener('pointerdown', (e) => {
            if(e.target.closest('#ui-container') || e.target.closest('#dev-toggle-container')) return;
            pDown.set(e.clientX, e.clientY); pTime = performance.now();
        });

        window.addEventListener('pointerup', (e) => {
            if(e.target.closest('#ui-container') || e.target.closest('#dev-toggle-container')) return;
            if (pDown.distanceTo(new THREE.Vector2(e.clientX, e.clientY)) > 10 || performance.now() - pTime > 300) return;

            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            
            const intersects = raycaster.intersectObjects(raycastTargets);
            if (intersects.length > 0) {
                let pt = intersects[0].point;
                let nx = Math.round(pt.x / GRID_SIZE) * GRID_SIZE;
                let nz = Math.round(pt.z / GRID_SIZE) * GRID_SIZE;

                if(Math.abs(nx) <= GRID_EXTENT && Math.abs(nz) <= GRID_EXTENT) {
                    const isRiverTool = (GAME.selectedType === 'pump' || GAME.selectedType === 'wheel');
                    if (isRiverTool && nx !== 0) return; 
                    if (!isRiverTool && nx === 0) return; 
                    createNode(GAME.selectedType, nx, nz);
                }
            }
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // ==========================================
        // ⚙️ SIMULATION LOGIC
        // ==========================================
        const clock = new THREE.Clock();
        const uiStats = {
            e: document.getElementById('val-energy'), c: document.getElementById('val-cap'),
            w: document.getElementById('val-water'), wc: document.getElementById('val-wcap'),
            co: document.getElementById('val-compost'), coc: document.getElementById('val-ccap')
        };
        const uiBanner = document.getElementById('harmony-banner');

        function updateSystems(dt, sunIntensity, isDay) {
            let eGen = 0, eCon = 0, eCap = 0, lCount = 0;
            let wGen = 0, wCon = 0, wCap = 0, gCount = 0;
            let cCap = 0, bCount = 0;

            let effSun = sunIntensity * (1.0 - (GAME.weather.cloudCover * 0.6));
            let isRaining = GAME.weather.rainIntensity > 0;

            // 1. Base Loops (Capacities & Passive Gen)
            GAME.nodes.forEach(n => {
                if(n.type === 'battery') eCap += 100;
                if(n.type === 'collector') wCap += 50;
                if(n.type === 'pipe') wCap += 25; 
                if(n.type === 'composter') cCap += 50;
                
                if(n.type === 'solar') eGen += 10 * effSun;
                if(n.type === 'wind')  eGen += 8 * GAME.weather.windSpeed;
                if(n.type === 'wheel') wGen += 3; 

                if(n.type === 'light') { eCon += 4; lCount++; }
                if(n.type === 'garden') { wCon += 2; gCount++; }
                if(n.type === 'biomass') { bCount++; }
            });
            
            GAME.capacity = eCap; GAME.waterCapacity = wCap; GAME.compostCapacity = cCap;

            // 2. Resolve Water
            let hasPowerForPumpCheck = (GAME.energy > 0 || eGen > 0); 
            let pumpExists = false;
            GAME.nodes.forEach(n => {
                if(n.type === 'pump') {
                    pumpExists = true;
                    eCon += 5;
                    if (hasPowerForPumpCheck) wGen += 10; 
                }
                if(n.type === 'collector' && isRaining) wGen += 5 * GAME.weather.rainIntensity;
            });

            let netW = wGen - wCon;
            GAME.water = Math.max(0, Math.min(GAME.waterCapacity, GAME.water + netW * dt));
            let hasWater = GAME.water > 0 || wGen >= wCon;
            if(GAME.waterCapacity === 0 && wGen < wCon) hasWater = false;
            if(gCount === 0) hasWater = true;

            // 3. Resolve Compost & Biomass
            let cGen = (hasWater && gCount > 0) ? (gCount * 1.0) : 0; 
            let cCon = bCount * 2.0; 
            
            let netC = cGen - cCon;
            GAME.compost = Math.max(0, Math.min(GAME.compostCapacity, GAME.compost + netC * dt));
            
            let hasCompost = GAME.compost > 0 || cGen >= cCon;
            if(GAME.compostCapacity === 0 && cGen < cCon) hasCompost = false;

            if (hasCompost && bCount > 0) {
                eGen += bCount * 15.0; 
            }

            // 4. Resolve Final Energy
            let netE = eGen - eCon;
            GAME.energy = Math.max(0, Math.min(GAME.capacity, GAME.energy + netE * dt));
            let hasPower = GAME.energy > 0 || eGen >= eCon;
            if(GAME.capacity === 0 && eGen < eCon) hasPower = false;
            if(lCount === 0) hasPower = true;

            // -- PROGRESSION CHECKS --
            if (lCount > 0 && !hasPower && !isDay && !KNOWLEDGE.understands_storage) {
                GAME.timers.blackout += dt;
                if (GAME.timers.blackout > 3) { KNOWLEDGE.understands_storage = true; updateUI(); }
            }
            if (KNOWLEDGE.understands_storage && !KNOWLEDGE.understands_wind && GAME.weather.cloudCover > 0.4) {
                GAME.timers.wind += dt;
                if (GAME.timers.wind > 4) { KNOWLEDGE.understands_wind = true; updateUI(); }
            }
            if (!KNOWLEDGE.understands_rain && isRaining) {
                GAME.timers.rain += dt;
                if (GAME.timers.rain > 3) { KNOWLEDGE.understands_rain = true; updateUI(); }
            }
            if (!KNOWLEDGE.understands_agriculture && GAME.nodes.some(n => n.type === 'collector' && GAME.water > 5)) {
                KNOWLEDGE.understands_agriculture = true; updateUI();
            }
            if (KNOWLEDGE.understands_agriculture && !KNOWLEDGE.understands_pumping && gCount > 0) {
                GAME.timers.drought += dt;
                if (GAME.timers.drought > 5) { KNOWLEDGE.understands_pumping = true; updateUI(); }
            }
            if (KNOWLEDGE.understands_pumping && !KNOWLEDGE.understands_kinetic_energy && pumpExists) {
                GAME.timers.river += dt;
                if (GAME.timers.river > 5) { KNOWLEDGE.understands_kinetic_energy = true; updateUI(); }
            }
            if (KNOWLEDGE.understands_agriculture && !KNOWLEDGE.understands_decay && gCount > 0 && hasWater) {
                GAME.timers.decay += dt;
                if (GAME.timers.decay > 6) { KNOWLEDGE.understands_decay = true; updateUI(); }
            }

            // Visual Updates
            GAME.nodes.forEach(n => {
                if(n.type === 'battery') {
                    let fill = eCap > 0 ? GAME.energy / eCap : 0;
                    n.fillMesh.scale.y += (Math.max(0.01, fill) - n.fillMesh.scale.y) * 0.1;
                    n.fillMesh.position.y = 0.2 + (1.2 * n.fillMesh.scale.y) / 2;
                }
                if(n.type === 'collector') {
                    let fill = wCap > 0 ? GAME.water / wCap : 0;
                    n.fillMesh.scale.y += (Math.max(0.01, fill) - n.fillMesh.scale.y) * 0.1;
                    n.fillMesh.position.y = 0.1 + (0.9 * n.fillMesh.scale.y) / 2;
                }
                if(n.type === 'composter') {
                    let fill = cCap > 0 ? GAME.compost / cCap : 0;
                    n.fillMesh.scale.y += (Math.max(0.01, fill) - n.fillMesh.scale.y) * 0.1;
                    n.fillMesh.position.y = 0.05 + (0.7 * n.fillMesh.scale.y) / 2;
                }
                if(n.type === 'biomass') {
                    let isBurning = (hasCompost && eCon > 0); 
                    if(isBurning !== n.isOn) {
                        n.isOn = isBurning;
                        n.core.material = isBurning ? mats.fireOn : mats.fireOff;
                        n.pLight.intensity = isBurning ? 1.5 : 0;
                    }
                }
                if(n.type === 'light') {
                    if(hasPower !== n.isOn) {
                        n.isOn = hasPower;
                        n.bulb.material = hasPower ? mats.lightOn : mats.lightOff;
                        n.pLight.intensity = hasPower ? 1.5 : 0;
                    }
                }
                if(n.type === 'wind') n.rotor.rotation.z -= dt * GAME.weather.windSpeed * 8;
                if(n.type === 'wheel') n.rotor.rotation.x -= dt * 2;
                if(n.type === 'garden') {
                    n.plants.forEach(p => {
                        let targetScale = hasWater ? 1.0 : 0.1;
                        p.scale.x += (targetScale - p.scale.x) * (dt * 2);
                        p.scale.y = p.scale.z = p.scale.x;
                        p.position.y = 0.2 + (p.scale.y * 0.2); 
                    });

                    if (hasWater) {
                        n.leaf.visible = true;
                        n.leafFallPhase += dt * 0.5; 
                        if (n.leafFallPhase > 1) n.leafFallPhase = 0;
                        n.leaf.position.y = 1.5 - (n.leafFallPhase * 1.4);
                        n.leaf.rotation.z = Math.sin(n.leafFallPhase * 10) * 0.5;
                        n.leaf.rotation.x = Math.cos(n.leafFallPhase * 8) * 0.5;
                    } else {
                        n.leaf.visible = false;
                    }
                }
            });

            uiStats.e.innerText = Math.floor(GAME.energy); uiStats.c.innerText = Math.floor(GAME.capacity);
            uiStats.w.innerText = Math.floor(GAME.water); uiStats.wc.innerText = Math.floor(GAME.waterCapacity);
            uiStats.co.innerText = Math.floor(GAME.compost); uiStats.coc.innerText = Math.floor(GAME.compostCapacity);

            if(lCount > 0 && gCount > 0 && hasPower && hasWater) {
                GAME.stableTime += dt;
                if(GAME.stableTime >= CYCLE_DURATION && !GAME.harmonyReached) {
                    GAME.harmonyReached = true; uiBanner.style.opacity = 1;
                }
            } else { GAME.stableTime = 0; }
        }

        function animate() {
            requestAnimationFrame(animate);
            const dt = Math.min(clock.getDelta(), 0.1); 
            controls.update(); 

            GAME.time += dt;
            GAME.weather.cloudCover = (Math.sin(GAME.time / 10) + 1) / 2 * (Math.sin(GAME.time / 22) + 1) / 2; 
            GAME.weather.windSpeed = ((Math.cos(GAME.time / 8) + 1) / 2 * (Math.sin(GAME.time / 15) + 1) / 2) * 0.9 + 0.1;
            GAME.weather.rainIntensity = Math.max(0, (GAME.weather.cloudCover - 0.65) / 0.35);

            GAME.nodes.forEach(n => {
                if(n.group.scale.x < 1) {
                    let s = n.group.scale.x + dt * 4;
                    if(s > 1) s = 1;
                    n.group.scale.set(s,s,s);
                }
            });

            let cycle = (GAME.time % CYCLE_DURATION) / CYCLE_DURATION;
            let angle = cycle * Math.PI * 2 - (Math.PI / 2); 
            sun.position.set(Math.cos(angle)*50, Math.sin(angle)*50, Math.sin(angle)*15); 
            moon.position.set(-sun.position.x, -sun.position.y, -sun.position.z);

            let sHeight = Math.max(0, Math.sin(angle));
            let isDay = sun.position.y > 0;
            
            let dayCol = colDayClear.clone().lerp(colDayCloud, GAME.weather.cloudCover);
            let targetBg = isDay ? dayCol : colNight;
            scene.background.lerp(targetBg, 0.05); scene.fog.color.lerp(targetBg, 0.05);
            
            sun.intensity = sHeight * 1.5 * (1.0 - (GAME.weather.cloudCover * 0.6));
            ambientLight.intensity = isDay ? 0.4 + (sHeight * 0.2) * (1.0 - GAME.weather.cloudCover * 0.3) : 0.2;

            GAME.nodes.forEach(n => { if(n.type === 'solar' && isDay) n.panel.lookAt(sun.position); });

            updateSystems(dt, sHeight, isDay);

            const sPos = particlesSpore.geometry.attributes.position.array;
            const rPos = particlesRain.geometry.attributes.position.array;
            
            for(let i=0; i<pCount; i++) {
                let sy = sPos[i*3+1] + dt * 0.5;
                let sx = sPos[i*3] + dt * GAME.weather.windSpeed * 15; 
                if(sy > 20 || sx > (ISLAND_SIZE * 0.8)) {
                    sy = -5; sx = -(ISLAND_SIZE * 0.8);
                    sPos[i*3+2] = (Math.random() - 0.5) * ISLAND_SIZE * 1.5;
                }
                sPos[i*3] = sx; sPos[i*3+1] = sy;

                let ry = rPos[i*3+1] - dt * 30; 
                if(ry < -2) {
                    ry = 20 + Math.random() * 10;
                    rPos[i*3] = (Math.random() - 0.5) * ISLAND_SIZE * 1.5;
                    rPos[i*3+2] = (Math.random() - 0.5) * ISLAND_SIZE * 1.5;
                }
                rPos[i*3+1] = ry;
            }
            particlesSpore.geometry.attributes.position.needsUpdate = true;
            particlesRain.geometry.attributes.position.needsUpdate = true;
            
            matRain.opacity = GAME.weather.rainIntensity * 0.6; 

            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
