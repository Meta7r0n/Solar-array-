<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>Solarpunk Sandbox - Weather & Wind</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        :root {
            --bg: #1a2639;
            --ui-bg: rgba(255, 255, 255, 0.85);
            --ui-active: #7cb06d;
            --text: #2c3e50;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            touch-action: none;
        }
        #canvas-container {
            width: 100%;
            height: 100%;
            display: block;
        }
        #ui-container {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            background: var(--ui-bg);
            padding: 10px 20px;
            border-radius: 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            backdrop-filter: blur(5px);
            z-index: 10;
            transition: all 0.5s ease;
        }
        .tool-btn {
            background: none;
            border: 2px solid transparent;
            padding: 12px 16px;
            font-size: 1.5rem;
            border-radius: 25px;
            cursor: pointer;
            color: var(--text);
            font-weight: bold;
            transition: all 0.5s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            width: 60px;
            height: 60px;
            opacity: 0;
            transform: translateY(10px);
            animation: fadeIn 0.5s forwards ease-out;
        }
        @keyframes fadeIn {
            to { opacity: 1; transform: translateY(0); }
        }
        .tool-btn:active {
            transform: scale(0.95);
        }
        .tool-btn.active {
            background: var(--ui-active);
            color: white;
            box-shadow: 0 4px 15px rgba(124, 176, 109, 0.4);
        }
        #harmony-banner {
            position: absolute;
            top: 15%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 255, 255, 0.9);
            color: #7cb06d;
            padding: 15px 30px;
            border-radius: 30px;
            font-size: 1.5rem;
            font-weight: bold;
            box-shadow: 0 10px 30px rgba(124, 176, 109, 0.3);
            opacity: 0;
            pointer-events: none;
            transition: opacity 2s ease-in-out;
            z-index: 20;
            text-align: center;
        }
        #status-bar {
            position: absolute;
            top: 20px;
            left: 20px;
            background: var(--ui-bg);
            padding: 10px 20px;
            border-radius: 20px;
            color: var(--text);
            font-size: 1rem;
            font-weight: 600;
            pointer-events: none;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        #controls-hint {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255,255,255,0.5);
            padding: 8px 15px;
            border-radius: 15px;
            font-size: 0.8rem;
            color: var(--text);
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="canvas-container"></div>
    
    <div id="status-bar">
        Grid: <span id="val-energy">0</span> / <span id="val-cap">0</span> kWh
    </div>

    <div id="controls-hint">
        Drag to Rotate &bull; Pinch to Zoom
    </div>

    <div id="harmony-banner">Harmony Achieved<br><span style="font-size: 0.9rem; font-weight: normal; color: #555;">The ecosystem is stabilizing.</span></div>

    <div id="ui-container"></div>

    <script>
        // ==========================================
        // 🧠 PROGRESSION ARCHITECTURE & PHILOSOPHY
        // ==========================================
        
        const DISCIPLINES = {
            MECHANICAL: 'mechanical',       
            ELECTRICAL: 'electrical',       
            CIVIL: 'civil',                 
            ENVIRONMENTAL: 'environmental', 
            AGRICULTURAL: 'agricultural',   
            MATERIALS: 'materials',         
            CHEMISTRY: 'chemistry',         
            ECOLOGY: 'ecology'              
        };

        const KNOWLEDGE = {
            understands_daylight: true,       
            understands_power_flow: true,     
            understands_storage: false,       // Discovered when lights blackout at night.
            understands_wind: false,          // Discovered when solar underperforms on windy/cloudy days.
            understands_water_flow: false,    // Future
        };

        const NODE_REGISTRY = {
            'solar': {
                id: 'solar',
                icon: '☀️',
                discipline: DISCIPLINES.ELECTRICAL,
                knowledgeRequired: ['understands_daylight'],
                /* --- DESIGN RULE ---
                   Solves: Base electricity generation
                   Introduces: Vulnerable to night and clouds
                ---------------------- */
            },
            'light': {
                id: 'light',
                icon: '💡',
                discipline: DISCIPLINES.ELECTRICAL,
                knowledgeRequired: ['understands_power_flow'],
                /* --- DESIGN RULE ---
                   Solves: Illuminates base
                   Introduces: Continuous grid drain
                ---------------------- */
            },
            'battery': {
                id: 'battery',
                icon: '🔋',
                discipline: DISCIPLINES.ELECTRICAL,
                knowledgeRequired: ['understands_storage'],
                /* --- DESIGN RULE ---
                   Solves: Stores excess generation for night
                   Introduces: Limited capacity bottleneck
                ---------------------- */
            },
            'wind': {
                id: 'wind',
                icon: '🌀',
                discipline: DISCIPLINES.MECHANICAL,
                knowledgeRequired: ['understands_wind'],
                /* --- DESIGN RULE ---
                   Solves: Power generation during night/cloudy days
                   Introduces: Variable, unpredictable output based on weather
                ---------------------- */
            }
        };


        // ==========================================
        // 🎮 GAME STATE & WEATHER SIMULATION
        // ==========================================
        const CYCLE_DURATION = 60; 
        const GRID_SIZE = 2;
        const ISLAND_SIZE = 40; 
        const GRID_EXTENT = (ISLAND_SIZE / 2) - 2;
        
        const GAME = {
            energy: 0,
            capacity: 0,
            nodes: [],
            gridMap: new Set(),
            selectedType: 'solar',
            time: 0,
            stableTime: 0,
            harmonyReached: false,
            
            // Progression Trackers
            blackoutObservationTime: 0, 
            windObservationTime: 0,
            uiRenderedNodes: new Set(),

            // Environmental Systems
            weather: {
                cloudCover: 0, // 0 = clear, 1 = fully overcast
                windSpeed: 0.2 // 0 = calm, 1 = gale
            }
        };


        // ==========================================
        // 🖥️ UI & DISCOVERY SYSTEM
        // ==========================================
        const uiContainer = document.getElementById('ui-container');

        function updateUI() {
            let selectedTypeExists = false;

            for (const [key, node] of Object.entries(NODE_REGISTRY)) {
                const hasKnowledge = node.knowledgeRequired.every(req => KNOWLEDGE[req]);
                
                if (hasKnowledge && !GAME.uiRenderedNodes.has(key)) {
                    const btn = document.createElement('button');
                    btn.className = 'tool-btn';
                    btn.dataset.type = key;
                    btn.innerHTML = node.icon;
                    
                    if (GAME.uiRenderedNodes.size === 0) {
                        btn.classList.add('active');
                        GAME.selectedType = key;
                    }

                    btn.addEventListener('pointerdown', (e) => {
                        e.stopPropagation();
                        document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
                        btn.classList.add('active');
                        GAME.selectedType = key;
                    });

                    uiContainer.appendChild(btn);
                    GAME.uiRenderedNodes.add(key);
                }

                if (key === GAME.selectedType && hasKnowledge) selectedTypeExists = true;
            }

            if (!selectedTypeExists && GAME.uiRenderedNodes.size > 0) {
                const firstBtn = uiContainer.querySelector('.tool-btn');
                if(firstBtn) {
                    firstBtn.classList.add('active');
                    GAME.selectedType = firstBtn.dataset.type;
                }
            }
        }

        updateUI();


        // ==========================================
        // 🌍 THREE.JS SETUP & ENGINE
        // ==========================================
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        
        const colDayClear = new THREE.Color(0x8bd4e8);
        const colDayCloud = new THREE.Color(0x8f9ba6);
        const colNight = new THREE.Color(0x0a1128);
        
        scene.background = colDayClear.clone();
        scene.fog = new THREE.Fog(colDayClear.clone(), 30, 100);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 150);
        camera.position.set(30, 35, 30);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.enablePan = false; 
        controls.maxPolarAngle = Math.PI / 2 - 0.05; 
        controls.minDistance = 15;
        controls.maxDistance = 80;
        controls.target.set(0, 0, 0);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
        scene.add(ambientLight);

        const sun = new THREE.DirectionalLight(0xfff5b6, 1.5);
        sun.castShadow = true;
        sun.shadow.mapSize.width = 2048; 
        sun.shadow.mapSize.height = 2048;
        sun.shadow.camera.near = 0.5;
        sun.shadow.camera.far = 100;
        sun.shadow.camera.left = -30;
        sun.shadow.camera.right = 30;
        sun.shadow.camera.top = 30;
        sun.shadow.camera.bottom = -30;
        sun.shadow.bias = -0.001;
        scene.add(sun);

        const moon = new THREE.DirectionalLight(0x7c9bc2, 0.2);
        scene.add(moon);

        // Island Mesh
        const matGrass = new THREE.MeshStandardMaterial({ color: 0x7cb06d, roughness: 0.9 });
        const matDirt = new THREE.MeshStandardMaterial({ color: 0x8c7356, roughness: 1.0 });
        
        const islandGroup = new THREE.Group();
        const topGeo = new THREE.BoxGeometry(ISLAND_SIZE, 1, ISLAND_SIZE);
        const islandTop = new THREE.Mesh(topGeo, matGrass);
        islandTop.position.y = -0.5;
        islandTop.receiveShadow = true;
        islandTop.castShadow = true;
        islandGroup.add(islandTop);

        const baseGeo = new THREE.BoxGeometry(ISLAND_SIZE - 2, 4, ISLAND_SIZE - 2);
        const islandBase = new THREE.Mesh(baseGeo, matDirt);
        islandBase.position.y = -3;
        islandBase.receiveShadow = true;
        islandBase.castShadow = true;
        islandGroup.add(islandBase);

        scene.add(islandGroup);

        // Wind/Spore Particles
        const particleGeo = new THREE.BufferGeometry();
        const particleCount = 200;
        const posArray = new Float32Array(particleCount * 3);
        for(let i=0; i<particleCount*3; i++) {
            posArray[i] = (Math.random() - 0.5) * ISLAND_SIZE * 1.5;
        }
        particleGeo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
        const particleMat = new THREE.PointsMaterial({ size: 0.2, color: 0xffffff, transparent: true, opacity: 0.6 });
        const particles = new THREE.Points(particleGeo, particleMat);
        scene.add(particles);

        // Shared Materials
        const matWhite = new THREE.MeshStandardMaterial({ color: 0xfdfdfd, roughness: 0.2 });
        const matWood = new THREE.MeshStandardMaterial({ color: 0xd4a373, roughness: 0.8 });
        const matPanel = new THREE.MeshStandardMaterial({ color: 0x1f3b4d, roughness: 0.2, metalness: 0.8 });
        const matBattEmpty = new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.5 });
        const matBattFill = new THREE.MeshStandardMaterial({ color: 0x4caf50, roughness: 0.3, emissive: 0x4caf50, emissiveIntensity: 0.2 });
        const matLightOff = new THREE.MeshStandardMaterial({ color: 0xaaaaaa, roughness: 0.4 });
        const matLightOn = new THREE.MeshStandardMaterial({ color: 0xffea00, emissive: 0xffea00, emissiveIntensity: 1.5 });
        const matTurbine = new THREE.MeshStandardMaterial({ color: 0xe0e0e0, roughness: 0.4 });


        // ==========================================
        // 🏗️ BUILDING & INTERACTION
        // ==========================================
        function createNode(type, x, z) {
            const key = `${x},${z}`;
            if(GAME.gridMap.has(key)) return;
            GAME.gridMap.add(key);

            const group = new THREE.Group();
            group.position.set(x, 0, z);
            
            let nodeData = { type, group, x, z };

            if(type === 'solar') {
                const base = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.2, 1.2), matWhite);
                base.position.y = 0.1;
                base.castShadow = true;
                
                const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 0.8), matWhite);
                pole.position.y = 0.5;
                pole.castShadow = true;

                const panel = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.1, 1.6), matPanel);
                panel.position.y = 0.9;
                panel.rotation.x = Math.PI / 6;
                panel.castShadow = true;

                group.add(base, pole, panel);
                nodeData.panel = panel;
            } 
            else if(type === 'battery') {
                const base = new THREE.Mesh(new THREE.BoxGeometry(1.4, 0.2, 1.4), matWhite);
                base.position.y = 0.1;
                base.castShadow = true;

                const coreShell = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.5, 1.2, 16), matBattEmpty);
                coreShell.position.y = 0.8;
                coreShell.castShadow = true;
                
                const coreFill = new THREE.Mesh(new THREE.CylinderGeometry(0.52, 0.52, 1.2, 16), matBattFill);
                coreFill.position.y = 0.8;
                coreFill.scale.y = 0.01;
                
                group.add(base, coreShell, coreFill);
                nodeData.fillMesh = coreFill;
            }
            else if(type === 'light') {
                const base = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.2, 0.8), matWood);
                base.position.y = 0.1;
                base.castShadow = true;

                const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 2), matWood);
                pole.position.y = 1.1;
                pole.castShadow = true;

                const bulb = new THREE.Mesh(new THREE.SphereGeometry(0.3, 16, 16), matLightOff);
                bulb.position.y = 2.2;
                
                const pLight = new THREE.PointLight(0xffea00, 0, 8);
                pLight.position.y = 2.2;

                group.add(base, pole, bulb, pLight);
                nodeData.bulb = bulb;
                nodeData.pLight = pLight;
                nodeData.isOn = false;
            }
            else if(type === 'wind') {
                const base = new THREE.Mesh(new THREE.BoxGeometry(1.0, 0.3, 1.0), matTurbine);
                base.position.y = 0.15;
                base.castShadow = true;

                const tower = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.25, 4, 8), matTurbine);
                tower.position.y = 2.3;
                tower.castShadow = true;

                const nacelle = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.5, 0.8), matTurbine);
                nacelle.position.y = 4.3;
                nacelle.position.z = -0.2;
                nacelle.castShadow = true;

                // Rotor Group (to rotate)
                const rotorGroup = new THREE.Group();
                rotorGroup.position.set(0, 4.3, 0.2);

                const hub = new THREE.Mesh(new THREE.SphereGeometry(0.2, 8, 8), matTurbine);
                rotorGroup.add(hub);

                // 3 Blades
                for(let i=0; i<3; i++) {
                    const blade = new THREE.Mesh(new THREE.BoxGeometry(0.1, 1.8, 0.05), matTurbine);
                    blade.position.y = 0.9; 
                    const pivot = new THREE.Group();
                    pivot.rotation.z = (i * Math.PI * 2) / 3;
                    pivot.add(blade);
                    rotorGroup.add(pivot);
                    blade.castShadow = true;
                }

                group.add(base, tower, nacelle, rotorGroup);
                nodeData.rotor = rotorGroup;
                
                // Slightly randomize start rotation so they don't sync perfectly
                rotorGroup.rotation.z = Math.random() * Math.PI; 
            }

            group.scale.set(0, 0, 0);
            scene.add(group);
            GAME.nodes.push(nodeData);
        }

        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        let pointerDownPos = new THREE.Vector2();
        let pointerDownTime = 0;

        window.addEventListener('pointerdown', (e) => {
            if(e.target.closest('#ui-container')) return;
            pointerDownPos.set(e.clientX, e.clientY);
            pointerDownTime = performance.now();
        });

        window.addEventListener('pointerup', (e) => {
            if(e.target.closest('#ui-container')) return;
            
            const dist = pointerDownPos.distanceTo(new THREE.Vector2(e.clientX, e.clientY));
            const timeDiff = performance.now() - pointerDownTime;

            if (dist > 10 || timeDiff > 300) return;

            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObject(islandTop);

            if (intersects.length > 0) {
                const pt = intersects[0].point;
                let nx = Math.round(pt.x / GRID_SIZE) * GRID_SIZE;
                let nz = Math.round(pt.z / GRID_SIZE) * GRID_SIZE;

                if(Math.abs(nx) <= GRID_EXTENT && Math.abs(nz) <= GRID_EXTENT) {
                    createNode(GAME.selectedType, nx, nz);
                }
            }
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // ==========================================
        // ⚙️ SIMULATION LOGIC & DISCOVERY CHECKER
        // ==========================================
        const clock = new THREE.Clock();
        const uiEnergy = document.getElementById('val-energy');
        const uiCap = document.getElementById('val-cap');
        const uiBanner = document.getElementById('harmony-banner');

        function updateEnergySystem(dt, sunIntensity, isDay) {
            let generation = 0;
            let consumption = 0;
            let capacity = 0;
            let lightCount = 0;

            // Weather impacts
            // Clouds reduce sun intensity by up to 60%
            let effectiveSun = sunIntensity * (1.0 - (GAME.weather.cloudCover * 0.6));

            GAME.nodes.forEach(n => {
                if(n.type === 'solar') generation += 10 * effectiveSun;
                if(n.type === 'wind')  generation += 8 * GAME.weather.windSpeed;
                if(n.type === 'battery') capacity += 100;
                if(n.type === 'light') {
                    consumption += 4;
                    lightCount++;
                }
            });

            GAME.capacity = capacity;
            let net = generation - consumption;
            GAME.energy += net * dt;

            if(GAME.energy > GAME.capacity) GAME.energy = GAME.capacity;
            if(GAME.energy < 0) GAME.energy = 0;

            let hasPower = GAME.energy > 0 || generation >= consumption;
            if(GAME.capacity === 0 && generation < consumption) hasPower = false; 
            if(lightCount === 0) hasPower = true; 

            // -- PROGRESSION: DISCOVERY CHECKS --
            
            // 1. Discover Storage: Lights out at night without power
            if (lightCount > 0 && !hasPower && !isDay && !KNOWLEDGE.understands_storage) {
                GAME.blackoutObservationTime += dt;
                if (GAME.blackoutObservationTime > 3) {
                    KNOWLEDGE.understands_storage = true;
                    updateUI(); 
                }
            } else if (hasPower) {
                GAME.blackoutObservationTime = 0;
            }

            // 2. Discover Wind: Unlocked storage, but clouds/wind present
            if (KNOWLEDGE.understands_storage && !KNOWLEDGE.understands_wind) {
                if (GAME.weather.cloudCover > 0.5 && GAME.weather.windSpeed > 0.5) {
                    GAME.windObservationTime += dt;
                    if (GAME.windObservationTime > 4) { // Observe the windy/cloudy conditions
                        KNOWLEDGE.understands_wind = true;
                        updateUI();
                    }
                } else {
                    GAME.windObservationTime = 0;
                }
            }

            // Apply state to visuals
            GAME.nodes.forEach(n => {
                if(n.type === 'battery') {
                    let fillRatio = capacity > 0 ? GAME.energy / capacity : 0;
                    n.fillMesh.scale.y += (Math.max(0.01, fillRatio) - n.fillMesh.scale.y) * 0.1;
                    n.fillMesh.position.y = 0.2 + (1.2 * n.fillMesh.scale.y) / 2;
                }
                if(n.type === 'light') {
                    let shouldBeOn = hasPower;
                    if(shouldBeOn !== n.isOn) {
                        n.isOn = shouldBeOn;
                        n.bulb.material = shouldBeOn ? matLightOn : matLightOff;
                        n.pLight.intensity = shouldBeOn ? 1.5 : 0;
                    }
                }
                if(n.type === 'wind') {
                    // Rotate based on wind speed
                    n.rotor.rotation.z -= dt * GAME.weather.windSpeed * 8;
                }
            });

            uiEnergy.innerText = Math.floor(GAME.energy);
            uiCap.innerText = Math.floor(GAME.capacity);

            // Win Condition
            if(lightCount > 0 && hasPower) {
                GAME.stableTime += dt;
                if(GAME.stableTime >= CYCLE_DURATION && !GAME.harmonyReached) {
                    GAME.harmonyReached = true;
                    uiBanner.style.opacity = 1;
                }
            } else if (lightCount > 0 && !hasPower) {
                GAME.stableTime = 0; 
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            const dt = Math.min(clock.getDelta(), 0.1); 

            controls.update(); 

            // Weather System Evolution (Using intersecting sine waves for natural variance)
            GAME.time += dt;
            GAME.weather.cloudCover = (Math.sin(GAME.time / 15) + 1) / 2 * (Math.sin(GAME.time / 25) + 1) / 2; 
            // Wind speed varies between 0.1 and ~1.0
            GAME.weather.windSpeed = ((Math.cos(GAME.time / 10) + 1) / 2 * (Math.sin(GAME.time / 18) + 1) / 2) * 0.9 + 0.1;

            // Spawn Animations
            GAME.nodes.forEach(n => {
                if(n.group.scale.x < 1) {
                    n.group.scale.x += dt * 4;
                    n.group.scale.y += dt * 4;
                    n.group.scale.z += dt * 4;
                    if(n.group.scale.x > 1) n.group.scale.set(1,1,1);
                }
            });

            // Day/Night Cycle
            let cycleProgress = (GAME.time % CYCLE_DURATION) / CYCLE_DURATION;
            let angle = cycleProgress * Math.PI * 2 - (Math.PI / 2); 

            sun.position.x = Math.cos(angle) * 50;
            sun.position.y = Math.sin(angle) * 50;
            sun.position.z = Math.sin(angle) * 15; 

            moon.position.x = -sun.position.x;
            moon.position.y = -sun.position.y;
            moon.position.z = -sun.position.z;

            let sunHeight = Math.max(0, Math.sin(angle));
            
            // Sky colors mixed with weather
            let isDay = sun.position.y > 0;
            
            // 1. Blend clear day with clouds
            let currentDayCol = colDayClear.clone().lerp(colDayCloud, GAME.weather.cloudCover);
            // 2. Blend resulting day color with night
            let targetBg = isDay ? currentDayCol : colNight;
            
            scene.background.lerp(targetBg, 0.05);
            scene.fog.color.lerp(targetBg, 0.05);
            
            // Lighting adjustments based on sun height AND clouds
            sun.intensity = sunHeight * 1.5 * (1.0 - (GAME.weather.cloudCover * 0.6));
            ambientLight.intensity = isDay ? 0.4 + (sunHeight * 0.2) * (1.0 - GAME.weather.cloudCover * 0.3) : 0.2;

            // Solar panels track sun
            GAME.nodes.forEach(n => {
                if(n.type === 'solar' && isDay) n.panel.lookAt(sun.position);
            });

            // Energy & Logic
            updateEnergySystem(dt, sunHeight, isDay);

            // Wind Particles Animation
            const positions = particles.geometry.attributes.position.array;
            for(let i=0; i<particleCount; i++) {
                let x = positions[i*3];
                let y = positions[i*3+1];
                let z = positions[i*3+2];
                
                // Drift up slowly, blow across horizontally based on wind
                y += dt * 0.5;
                x += dt * GAME.weather.windSpeed * 15; // Wind pushes particles heavily
                
                if(y > 20 || x > (ISLAND_SIZE * 0.8)) {
                    y = -5;
                    x = -(ISLAND_SIZE * 0.8);
                    z = (Math.random() - 0.5) * ISLAND_SIZE * 1.5;
                }
                
                positions[i*3] = x;
                positions[i*3+1] = y;
                positions[i*3+2] = z;
            }
            particles.geometry.attributes.position.needsUpdate = true;

            renderer.render(scene, camera);
        }

        animate();

    </script>
</body>
</html>
