<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solarpunk Island Colony</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #87CEEB; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; user-select: none; }
        #game-canvas { display: block; width: 100vw; height: 100vh; }
        
        /* UI Layer */
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        
        .panel { background: rgba(255, 255, 255, 0.85); border-radius: 12px; padding: 15px; margin: 15px; pointer-events: auto; box-shadow: 0 4px 6px rgba(0,0,0,0.1); backdrop-filter: blur(4px); }
        
        #top-bar { display: flex; justify-content: space-between; align-items: flex-start; }
        
        #colony-stats { width: 250px; }
        #colony-stats h2 { margin: 0 0 10px 0; color: #2E8B57; font-size: 1.2rem; }
        .stat-row { display: flex; justify-content: space-between; margin-bottom: 5px; font-weight: bold; color: #333; }
        
        #inventory-panel { width: 200px; }
        #inventory-panel h3 { margin: 0 0 10px 0; color: #D2691E; font-size: 1.1rem; }
        #inventory-list { list-style: none; padding: 0; margin: 0; }
        #inventory-list li { display: flex; justify-content: space-between; border-bottom: 1px solid #ddd; padding: 4px 0; }
        
        #action-prompt { position: absolute; bottom: 20%; left: 50%; transform: translateX(-50%); background: rgba(0, 0, 0, 0.7); color: white; padding: 10px 20px; border-radius: 20px; font-size: 1.2rem; display: none; text-align: center; }
        
        #notification-area { position: absolute; bottom: 20px; right: 20px; width: 300px; display: flex; flex-direction: column; gap: 10px; }
        .notification { background: rgba(46, 139, 87, 0.9); color: white; padding: 10px; border-radius: 8px; animation: fadeout 4s forwards; }
        
        @keyframes fadeout {
            0% { opacity: 1; transform: translateY(0); }
            70% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(10px); }
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="game-canvas"></div>
    <div id="ui-layer">
        <div id="top-bar">
            <div id="colony-stats" class="panel">
                <h2>Island Status</h2>
                <div class="stat-row"><span>Day:</span> <span id="ui-day">1</span></div>
                <div class="stat-row"><span>Time:</span> <span id="ui-time">08:00</span></div>
                <div class="stat-row"><span>Population:</span> <span id="ui-pop">1</span></div>
                <div class="stat-row"><span>Weather:</span> <span id="ui-weather">Clear</span></div>
            </div>
            <div id="inventory-panel" class="panel">
                <h3>Inventory</h3>
                <ul id="inventory-list"></ul>
            </div>
        </div>
        <div id="action-prompt">Press E to Interact</div>
        <div id="notification-area"></div>
    </div>

<script>
/**
 * TROPICAL ISLAND COLONY SURVIVAL
 * Architecture: Modular Manager Pattern (Fixed Initialization Order)
 */

// ==========================================
// 1. REGISTRIES & DATABASES
// ==========================================
const DATABASES = {
    Resources: {
        'banana': { id: 'banana', name: 'Banana', type: 'food', nutrition: 15, seedYield: 'banana_seed' },
        'banana_seed': { id: 'banana_seed', name: 'Banana Seed', type: 'seed', growsInto: 'banana_plant' },
        'sweet_potato': { id: 'sweet_potato', name: 'Sweet Potato', type: 'food', nutrition: 20, seedYield: 'sp_seed' },
        'sp_seed': { id: 'sp_seed', name: 'Sweet Potato Slip', type: 'seed', growsInto: 'sp_plant' },
        'wood': { id: 'wood', name: 'Driftwood', type: 'material' },
        'fruit_salad': { id: 'fruit_salad', name: 'Fruit Salad', type: 'food', nutrition: 40 }
    },
    Crops: {
        'banana_plant': { id: 'banana_plant', name: 'Banana Tree', yieldId: 'banana', yieldMin: 1, yieldMax: 3, growTime: 30, stages: 3 },
        'sp_plant': { id: 'sp_plant', name: 'Sweet Potato Patch', yieldId: 'sweet_potato', yieldMin: 2, yieldMax: 4, growTime: 20, stages: 3 }
    },
    Recipes: {
        'fruit_salad': { id: 'fruit_salad', name: 'Fruit Salad', ingredients: { 'banana': 2 }, result: 'fruit_salad', cookTime: 2 }
    }
};

// ==========================================
// 2. MANAGERS
// ==========================================

class ResourceManager {
    static getResource(id) { return DATABASES.Resources[id]; }
    static getCrop(id) { return DATABASES.Crops[id]; }
    static getRecipe(id) { return DATABASES.Recipes[id]; }
}

class UIManager {
    constructor() {
        this.els = {
            day: document.getElementById('ui-day'),
            time: document.getElementById('ui-time'),
            pop: document.getElementById('ui-pop'),
            weather: document.getElementById('ui-weather'),
            inv: document.getElementById('inventory-list'),
            prompt: document.getElementById('action-prompt'),
            notifications: document.getElementById('notification-area')
        };
    }
    
    updateTime(day, hour, minute) {
        this.els.day.innerText = day;
        this.els.time.innerText = `${hour.toString().padStart(2, '0')}:${minute.toString().padStart(2, '0')}`;
    }
    
    updateStats(population, weather) {
        this.els.pop.innerText = population;
        this.els.weather.innerText = weather;
    }
    
    updateInventory(inventoryMap) {
        this.els.inv.innerHTML = '';
        for (const [id, qty] of inventoryMap.entries()) {
            if (qty > 0) {
                const res = ResourceManager.getResource(id);
                const li = document.createElement('li');
                li.innerHTML = `<span>${res.name}</span> <span>${qty}</span>`;
                this.els.inv.appendChild(li);
            }
        }
    }

    showPrompt(text) {
        this.els.prompt.style.display = 'block';
        this.els.prompt.innerText = text;
    }

    hidePrompt() {
        this.els.prompt.style.display = 'none';
    }

    notify(message) {
        const div = document.createElement('div');
        div.className = 'notification';
        div.innerText = message;
        this.els.notifications.appendChild(div);
        setTimeout(() => { if (div.parentNode) div.parentNode.removeChild(div); }, 4000);
    }
}

class InventoryManager {
    constructor() {
        this.items = new Map();
    }
    add(id, qty = 1) {
        const current = this.items.get(id) || 0;
        this.items.set(id, current + qty);
        engine.ui.updateInventory(this.items);
    }
    remove(id, qty = 1) {
        const current = this.items.get(id) || 0;
        if (current >= qty) {
            this.items.set(id, current - qty);
            engine.ui.updateInventory(this.items);
            return true;
        }
        return false;
    }
    has(id, qty = 1) {
        return (this.items.get(id) || 0) >= qty;
    }
    getAllFood() {
        let foods = [];
        for (const [id, qty] of this.items.entries()) {
            if (qty > 0 && ResourceManager.getResource(id).type === 'food') foods.push({ id, qty });
        }
        return foods;
    }
}

class VillagerManager {
    constructor() {
        this.villagers = [];
    }
    init() {
        this.addVillager("Player");
    }
    addVillager(name = "Survivor") {
        this.villagers.push({
            name: name,
            hunger: 100,
            health: 100,
            state: 'idle'
        });
        if (engine && engine.ui) engine.ui.updateStats(this.villagers.length, engine.weather.current);
    }
    tickDailyFood() {
        engine.ui.notify("The colony consumes daily food.");
        for (let v of this.villagers) {
            let foods = engine.inventory.getAllFood();
            if (foods.length > 0) {
                engine.inventory.remove(foods[0].id, 1);
                v.hunger = 100;
            } else {
                v.hunger -= 30;
                engine.ui.notify(`Warning: ${v.name} is starving!`);
                if(v.hunger <= 0) {
                    engine.ui.notify(`Tragedy: ${v.name} has died of starvation.`);
                }
            }
        }
    }
}

class WeatherManager {
    constructor() {
        this.current = "Clear";
        this.timeSinceLastStorm = 0;
        this.stormDuration = 0;
    }
    update(dt) {
        if (this.current === "Clear") {
            this.timeSinceLastStorm += dt;
            if (this.timeSinceLastStorm > 120 && Math.random() < 0.001) {
                this.startStorm();
            }
        } else if (this.current === "Storm") {
            this.stormDuration -= dt;
            if (this.stormDuration <= 0) {
                this.endStorm();
            }
        }
    }
    startStorm() {
        this.current = "Storm";
        this.timeSinceLastStorm = 0;
        this.stormDuration = 30;
        engine.ui.updateStats(engine.villagers.villagers.length, this.current);
        engine.ui.notify("A violent storm approaches!");
    }
    endStorm() {
        this.current = "Clear";
        engine.ui.updateStats(engine.villagers.villagers.length, this.current);
        engine.ui.notify("The storm has passed. Check the beaches.");
        engine.shipwreck.triggerShipwreckEvent();
    }
}

class ShipwreckManager {
    triggerShipwreckEvent() {
        const angle = Math.random() * Math.PI * 2;
        const radius = 35;
        const x = Math.cos(angle) * radius;
        const z = Math.sin(angle) * radius;
        
        engine.world.spawnInteractable(x, z, 'shipwreck', {
            label: "Rescue Survivor [E]",
            onInteract: (obj) => {
                engine.villagers.addVillager();
                engine.ui.notify("You rescued a survivor! Population increased. Daily food demand increased.");
                engine.world.removeInteractable(obj);
            }
        });
        engine.ui.notify("Debris spotted on the horizon...");
    }
}

class FarmingManager {
    constructor() {
        this.crops = [];
    }
    plant(x, z, cropId) {
        const cropData = ResourceManager.getCrop(cropId);
        const mesh = engine.rendering.createCropMesh();
        mesh.position.set(x, 0.5, z);
        
        const crop = {
            id: cropId,
            mesh: mesh,
            age: 0,
            stage: 0,
            maxStages: cropData.stages,
            ready: false
        };
        
        this.crops.push(crop);
        engine.rendering.scene.add(mesh);
        engine.ui.notify(`Planted ${cropData.name}`);
    }
    update(dt) {
        for (let crop of this.crops) {
            if (crop.ready) continue;
            crop.age += dt;
            const data = ResourceManager.getCrop(crop.id);
            const stageTime = data.growTime / data.stages;
            
            if (crop.age > stageTime * (crop.stage + 1)) {
                crop.stage++;
                crop.mesh.scale.set(1 + crop.stage*0.5, 1 + crop.stage*0.5, 1 + crop.stage*0.5);
                
                if (crop.stage >= data.stages) {
                    crop.ready = true;
                    engine.world.spawnInteractable(crop.mesh.position.x, crop.mesh.position.z, 'harvestable', {
                        label: `Harvest ${data.name} [E]`,
                        mesh: crop.mesh,
                        onInteract: (obj) => {
                            const yieldAmt = Math.floor(Math.random() * (data.yieldMax - data.yieldMin + 1)) + data.yieldMin;
                            engine.inventory.add(data.yieldId, yieldAmt);
                            engine.inventory.add(ResourceManager.getResource(data.yieldId).seedYield, 1);
                            engine.ui.notify(`Harvested ${yieldAmt} ${ResourceManager.getResource(data.yieldId).name}`);
                            engine.world.removeInteractable(obj);
                            this.crops = this.crops.filter(c => c !== crop);
                        }
                    }, true);
                }
            }
        }
    }
}

class CookingManager {
    cook(recipeId) {
        const recipe = ResourceManager.getRecipe(recipeId);
        let canCook = true;
        for (const [ingId, qty] of Object.entries(recipe.ingredients)) {
            if (!engine.inventory.has(ingId, qty)) canCook = false;
        }
        
        if (canCook) {
            for (const [ingId, qty] of Object.entries(recipe.ingredients)) {
                engine.inventory.remove(ingId, qty);
            }
            engine.inventory.add(recipe.result, 1);
            engine.ui.notify(`Cooked 1 ${recipe.name}`);
        } else {
            engine.ui.notify(`Cannot cook ${recipe.name}. Missing ingredients.`);
        }
    }
}

// ==========================================
// 3. ENGINE & RENDERING
// ==========================================

class RenderingManager {
    constructor() {
        this.scene = new THREE.Scene();
        // Set an explicit background color immediately to prevent the black screen!
        this.scene.background = new THREE.Color(0x87CEEB); 
        this.scene.fog = new THREE.FogExp2(0x87CEEB, 0.015);

        this.camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        this.camera.position.set(0, 15, 20);

        this.renderer = new THREE.WebGLRenderer({ antialias: true });
        this.renderer.setSize(window.innerWidth, window.innerHeight);
        this.renderer.shadowMap.enabled = true;
        document.getElementById('game-canvas').appendChild(this.renderer.domElement);

        this.setupLighting();
        
        window.addEventListener('resize', () => {
            this.camera.aspect = window.innerWidth / window.innerHeight;
            this.camera.updateProjectionMatrix();
            this.renderer.setSize(window.innerWidth, window.innerHeight);
        });
    }

    setupLighting() {
        const ambient = new THREE.AmbientLight(0xffffff, 0.6);
        this.scene.add(ambient);

        this.sunLight = new THREE.DirectionalLight(0xffffff, 0.8);
        this.sunLight.position.set(50, 100, 50);
        this.sunLight.castShadow = true;
        this.scene.add(this.sunLight);
    }

    createIsland() {
        const oceanGeo = new THREE.PlaneGeometry(500, 500);
        const oceanMat = new THREE.MeshPhongMaterial({ color: 0x1ca3ec, transparent: true, opacity: 0.8 });
        const ocean = new THREE.Mesh(oceanGeo, oceanMat);
        ocean.rotation.x = -Math.PI / 2;
        ocean.position.y = -0.5;
        this.scene.add(ocean);

        const islandGeo = new THREE.CylinderGeometry(40, 45, 2, 32);
        const islandMat = new THREE.MeshPhongMaterial({ color: 0x2E8B57 });
        const island = new THREE.Mesh(islandGeo, islandMat);
        island.position.y = -0.5;
        island.receiveShadow = true;
        this.scene.add(island);
    }

    createPlayerMesh() {
        const geo = new THREE.CapsuleGeometry(0.5, 1, 4, 8);
        const mat = new THREE.MeshPhongMaterial({ color: 0xD2691E }); 
        const mesh = new THREE.Mesh(geo, mat);
        mesh.position.y = 1;
        mesh.castShadow = true;
        this.scene.add(mesh);
        return mesh;
    }

    createCampfireMesh(x, z) {
        const geo = new THREE.ConeGeometry(1, 2, 8);
        const mat = new THREE.MeshPhongMaterial({ color: 0x8B4513 });
        const mesh = new THREE.Mesh(geo, mat);
        mesh.position.set(x, 1, z);
        this.scene.add(mesh);
        return mesh;
    }

    createCropMesh() {
        const geo = new THREE.BoxGeometry(0.3, 0.3, 0.3);
        const mat = new THREE.MeshPhongMaterial({ color: 0x32CD32 });
        const mesh = new THREE.Mesh(geo, mat);
        return mesh;
    }

    render() {
        this.renderer.render(this.scene, this.camera);
    }
}

class PlayerManager {
    constructor() {
        this.speed = 8;
        this.keys = { w: false, a: false, s: false, d: false };

        window.addEventListener('keydown', (e) => this.handleKey(e.key.toLowerCase(), true));
        window.addEventListener('keyup', (e) => this.handleKey(e.key.toLowerCase(), false));
    }

    init() {
        this.mesh = engine.rendering.createPlayerMesh();
    }

    handleKey(key, isDown) {
        if (this.keys.hasOwnProperty(key)) this.keys[key] = isDown;
        
        if (isDown) {
            if (key === 'e') engine.world.attemptInteraction();
            if (key === 'c') engine.world.attemptCooking();
            if (key === 'p') this.attemptPlanting();
        }
    }

    attemptPlanting() {
        if (engine.inventory.has('sp_seed', 1)) {
            engine.inventory.remove('sp_seed', 1);
            engine.farming.plant(this.mesh.position.x, this.mesh.position.z, 'sp_plant');
        } else if (engine.inventory.has('banana_seed', 1)) {
            engine.inventory.remove('banana_seed', 1);
            engine.farming.plant(this.mesh.position.x, this.mesh.position.z, 'banana_plant');
        } else {
            engine.ui.notify("No seeds in inventory to plant.");
        }
    }

    update(dt) {
        if (!this.mesh) return;
        const dir = new THREE.Vector3();
        if (this.keys.w) dir.z -= 1;
        if (this.keys.s) dir.z += 1;
        if (this.keys.a) dir.x -= 1;
        if (this.keys.d) dir.x += 1;

        if (dir.lengthSq() > 0) {
            dir.normalize();
            this.mesh.position.addScaledVector(dir, this.speed * dt);
            
            const distFromCenter = Math.sqrt(this.mesh.position.x**2 + this.mesh.position.z**2);
            if (distFromCenter > 38) {
                this.mesh.position.subScaledVector(dir, this.speed * dt); 
            }
        }

        engine.rendering.camera.position.x = this.mesh.position.x;
        engine.rendering.camera.position.z = this.mesh.position.z + 15;
        engine.rendering.camera.lookAt(this.mesh.position);
    }
}

class WorldManager {
    constructor() {
        this.interactables = [];
    }

    init() {
        engine.rendering.createIsland();
        this.generateWilderness();
        
        const fireMesh = engine.rendering.createCampfireMesh(0, -5);
        this.spawnInteractable(0, -5, 'campfire', {
            label: "Campfire (Press C to Cook Fruit Salad. Needs 2 Bananas)",
            mesh: fireMesh,
            onInteract: () => {} 
        }, true);
    }

    generateWilderness() {
        for(let i=0; i<10; i++) {
            const angle = Math.random() * Math.PI * 2;
            const r = Math.random() * 30;
            const x = Math.cos(angle) * r;
            const z = Math.sin(angle) * r;
            
            const trunkGeo = new THREE.CylinderGeometry(0.5, 0.5, 3);
            const trunkMat = new THREE.MeshPhongMaterial({ color: 0x8B4513 });
            const tree = new THREE.Mesh(trunkGeo, trunkMat);
            tree.position.set(x, 1.5, z);
            
            const leavesGeo = new THREE.SphereGeometry(2);
            const leavesMat = new THREE.MeshPhongMaterial({ color: 0x228B22 });
            const leaves = new THREE.Mesh(leavesGeo, leavesMat);
            leaves.position.y = 2;
            tree.add(leaves);
            
            engine.rendering.scene.add(tree);

            this.spawnInteractable(x, z, 'wild_banana', {
                label: "Harvest Wild Bananas [E]",
                mesh: tree,
                onInteract: (obj) => {
                    engine.inventory.add('banana', 2);
                    engine.inventory.add('banana_seed', 1);
                    engine.ui.notify("Harvested Bananas and found a seed!");
                    this.removeInteractable(obj);
                }
            }, true);
        }
    }

    spawnInteractable(x, z, type, data, useExistingMesh = false) {
        let mesh = data.mesh;
        if (!useExistingMesh) {
            const geo = new THREE.BoxGeometry(1.5, 1.5, 1.5);
            const mat = new THREE.MeshPhongMaterial({ color: type === 'shipwreck' ? 0xA0522D : 0xffffff });
            mesh = new THREE.Mesh(geo, mat);
            mesh.position.set(x, 0.75, z);
            engine.rendering.scene.add(mesh);
        }
        this.interactables.push({ x, z, type, data, mesh });
    }

    removeInteractable(obj) {
        if (obj.mesh) engine.rendering.scene.remove(obj.mesh);
        this.interactables = this.interactables.filter(i => i !== obj);
        engine.ui.hidePrompt();
    }

    getClosestInteractable() {
        if (!engine.player.mesh) return null;
        const px = engine.player.mesh.position.x;
        const pz = engine.player.mesh.position.z;
        let closest = null;
        let minD = 3.0; 

        for (let obj of this.interactables) {
            const d = Math.hypot(px - obj.x, pz - obj.z);
            if (d < minD) {
                minD = d;
                closest = obj;
            }
        }
        return closest;
    }

    update(dt) {
        const closest = this.getClosestInteractable();
        if (closest) {
            engine.ui.showPrompt(closest.data.label);
        } else {
            engine.ui.hidePrompt();
        }
    }

    attemptInteraction() {
        const closest = this.getClosestInteractable();
        if (closest && closest.data.onInteract) {
            closest.data.onInteract(closest);
        }
    }

    attemptCooking() {
        if (!engine.player.mesh) return;
        const px = engine.player.mesh.position.x;
        const pz = engine.player.mesh.position.z;
        if (Math.hypot(px - 0, pz - (-5)) < 4.0) {
            engine.cooking.cook('fruit_salad');
        } else {
            engine.ui.notify("You must be near a campfire to cook.");
        }
    }
}

class GameEngine {
    constructor() {
        // Instantiate without calling each other yet
        this.ui = new UIManager();
        this.rendering = new RenderingManager();
        this.inventory = new InventoryManager();
        this.villagers = new VillagerManager();
        this.weather = new WeatherManager();
        this.shipwreck = new ShipwreckManager();
        this.farming = new FarmingManager();
        this.cooking = new CookingManager();
        this.world = new WorldManager();
        this.player = new PlayerManager();

        this.time = { day: 1, hour: 8, minute: 0, accumulator: 0 };
        this.lastFrame = performance.now();
        this.loop = this.loop.bind(this);
    }

    init() {
        // Now that the 'engine' variable exists globally, we can safely cross-reference!
        this.villagers.init();
        this.world.init();
        this.player.init();
        
        this.ui.updateStats(1, this.weather.current);
        this.ui.notify("Shipwrecked. Find food to survive.");
        
        requestAnimationFrame(this.loop);
    }

    updateTime(dt) {
        this.time.accumulator += dt;
        if (this.time.accumulator >= 1.0) {
            this.time.minute += 10;
            this.time.accumulator = 0;
            
            if (this.time.minute >= 60) {
                this.time.minute = 0;
                this.time.hour++;
                
                if (this.time.hour >= 24) {
                    this.time.hour = 0;
                    this.time.day++;
                    this.villagers.tickDailyFood();
                }
            }
            this.ui.updateTime(this.time.day, this.time.hour, this.time.minute);
            
            const angle = ((this.time.hour + this.time.minute/60) / 24) * Math.PI * 2 - Math.PI/2;
            this.rendering.sunLight.position.set(Math.cos(angle)*100, Math.sin(angle)*100, 50);
            this.rendering.scene.background = (this.time.hour > 18 || this.time.hour < 6) ? new THREE.Color(0x0a0a2a) : new THREE.Color(0x87CEEB);
            this.rendering.scene.fog.color = this.rendering.scene.background;
        }
    }

    loop(now) {
        const dt = (now - this.lastFrame) / 1000;
        this.lastFrame = now;

        this.updateTime(dt);
        this.player.update(dt);
        this.weather.update(dt);
        this.world.update(dt);
        this.farming.update(dt);
        
        this.rendering.render();
        requestAnimationFrame(this.loop);
    }
}

// Start Game Safely
const engine = new GameEngine();
engine.init(); // <--- This safely boots the cross-manager logic!

</script>
</body>
</html>
